<!DOCTYPE html>
<!--
  =============================================================================
  INDEX.HTML · PÁGINA PRINCIPAL (el "esqueleto" de la web)
  =============================================================================
  Esta es la ÚNICA página. Las pantallas (inicio, ronda, reglas...) no están
  aquí: las dibuja js/app.js dentro de la zona con id="view".

  ARCHIVOS QUE USA:
    css/estilos.css       estilos base (diseño original)
    css/tema-militar.css  tema verde oliva/arena; SOBRESCRIBE al anterior.
                          Si quieres cambiar colores o botones, edita ESTE.
    js/datos.js           textos de escenarios, reglas y facciones
    js/app.js             logica y pantallas
    pdf/reglas.pdf        PDF de "REFERENCIA REGLAS" (ruta en app.js, REGLAS_PDF)

  QUE CAMBIAR AQUI:
    - Nombre de la pestaña del navegador -> etiqueta title
    - Título grande de la web y lema     -> etiqueta header
    - Texto del pie (versión, autor)     -> etiqueta footer
    - Texto de la ventana de reiniciar   -> bloque id="resetConfirmModal"
  =============================================================================
-->
<html lang="es">
<head>
<!-- Codificación: permite tildes y ñ -->
<meta charset="UTF-8">
<!-- Adapta la web a móviles (no quitar) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Color de la barra del navegador en móvil (mismo oliva oscuro del tema) -->
<meta name="theme-color" content="#1c2214">
<!-- Nombre que aparece en la pestaña del navegador -->
<title>BOLT ACTION FANMADE</title>
<!-- TIPOGRAFÍAS de Google Fonts: Oswald (títulos y botones) y Barlow (textos).
     Necesitan internet. Sin conexión se usan fuentes del sistema (todo funciona igual).
     Para cambiar de letra: cambia los nombres en el enlace de abajo y también las
     variables --font-title y --font-body al principio de css/tema-militar.css -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- VERSIÓN DE LOS ARCHIVOS (?v=1.1 al final de cada enlace):
     Los móviles y navegadores guardan en caché los archivos y a veces siguen
     enseñando la versión antigua. CADA VEZ que subas cambios a la web, cambia
     el número (1.1 -> 1.2 -> 1.3...) en los CUATRO enlaces (2 de estilos y 2 de
     scripts) y el navegador descargará los archivos nuevos. -->
<!-- ESTILOS (el orden importa: el segundo sobrescribe al primero) -->
<link rel="stylesheet" href="css/estilos.css?v=1.1">
<!-- TEMA MILITAR: para volver al diseño anterior, borra o comenta la línea siguiente -->
<link rel="stylesheet" href="css/tema-militar.css?v=1.1">

</head>
<body>
<!-- ====== VENTANA DE CONFIRMACIÓN "¿REINICIAR PARTIDA?" ======
     Está oculta; aparece al pulsar REINICIAR PARTIDA en el inicio.
     El texto y los botones SÍ/NO se cambian aquí. La lógica está en app.js
     (resetMatch, confirmResetMatch). Su aspecto, en tema-militar.css (.reset-confirm-card). -->
<div class="reset-confirm-modal" id="resetConfirmModal" role="dialog" aria-modal="true" aria-labelledby="resetConfirmTitle">
 <div class="reset-confirm-card">
  <h2 id="resetConfirmTitle">¿REINICIAR PARTIDA?</h2>
  <p>Si confirmas, se borrará la partida guardada y el reloj volverá a cero. Si cancelas, todo seguirá igual.</p>
  <div class="reset-confirm-actions"><button type="button" data-reset-choice="yes">SÍ, REINICIAR</button><button type="button" class="cancel-reset" data-reset-choice="no">NO, CONTINUAR</button></div>
 </div>
</div>
<!-- ====== CONTENEDOR GENERAL DE LA WEB ====== -->
<div id="app">
<!-- CABECERA: título grande y lema. Solo se ve en la pantalla de inicio en móvil. -->
<header><h1>BOLT ACTION FANMADE</h1><p>ORDEN · ESTRATEGIA · VICTORIA</p></header>
<!-- ZONA DINÁMICA: aquí app.js dibuja la pantalla activa. Déjala vacía. -->
<main id="view"></main>
<!-- PIE DE PÁGINA: versión y autor. Cambia el texto, la versión y el nombre aquí. -->
<footer>Herramienta de apoyo para partidas de Bolt Action<br>Versión v 0.21 · Noviembre 2026<br><strong style="color:#f2c94c;font-weight:800;">Creado por TitoKobra</strong></footer>
</div>
<!-- SCRIPTS (el orden importa): primero los datos y después la lógica que los usa -->
<script src="js/datos.js?v=1.1"></script>
<script src="js/app.js?v=1.1"></script>
</body>
</html>
